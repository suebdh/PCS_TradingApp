# ==========================================
# Configuration principale Spring Boot
# ==========================================
#Application name
spring.application.name=PCS Trading (DEV)

# Niveau de log : permet de contrôler la verbosité de Spring
logging.level.org.springframework=INFO

# ==========================================
# Configuration de la source de données DEV
# ==========================================
# Configuration du driver JDBC MySQL moderne (remplace com.mysql.jdbc.Driver, obsolète depuis MySQL Connector 8)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/demo
# Paramètres de connexion à la base MySQL de development (chargés depuis le fichier .env.dev)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Configuration Hibernate / JPA
# ==========================================
# Exécute toujours les scripts SQL d'initialisation (même pour MySQL ou PostgreSQL, pas seulement pour les bases embarquées 'H2')
spring.sql.init.mode=always

# Chemins des scripts de création et d'alimentation
# Indique le chemin du fichier SQL qui contient la création du schéma (tables, contraintes, clés primaires, etc.)
spring.sql.init.schema-locations=classpath:database/schema.sql
# Indique le chemin du fichier SQL qui contient les données initiales à insérer (valeurs de test, comptes démo, etc.)
spring.sql.init.data-locations=classpath:database/data.sql

# Vérifie la cohérence entre les entités JPA et le schéma SQL existant,
# sans créer ni modifier automatiquement les tables (les tables viennent du schema.sql et non des entités JPA)
spring.jpa.hibernate.ddl-auto=validate
# show-sql=true ? affiche les requêtes SQL dans la console (utile en dev)
spring.jpa.show-sql=true
# Formate le SQL pour qu'il soit lisible
spring.jpa.properties.hibernate.format_sql=true
# Affiche les valeurs des paramètres SQL (binding) pour Hibernate 6 / Spring Boot 3
# Permet de voir dans les logs quelles valeurs remplacent les " ?" dans les requêtes préparées
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Définition explicite du dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=debug




