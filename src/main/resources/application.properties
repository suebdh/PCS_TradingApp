# ==========================================
# Configuration principale Spring Boot
# ==========================================
#Application name
spring.application.name=PCS Trading

# Niveau de log : permet de contrôler la verbosité de Spring
logging.level.org.springframework=INFO

# ==========================================
# Configuration de la source de données DEV
# ==========================================
# Configuration du driver JDBC MySQL moderne (remplace com.mysql.jdbc.Driver, obsolète depuis MySQL Connector 8)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/demo
# Paramètres de connexion à la base MySQL de development (chargés depuis le fichier .env.dev)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Configuration Hibernate / JPA
# ==========================================
# ddl-auto=update ? met à jour automatiquement le schéma si nécessaire
spring.jpa.hibernate.ddl-auto=update
# show-sql=true ? affiche les requêtes SQL dans la console (utile en dev)
spring.jpa.show-sql=true
# Définition explicite du dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect