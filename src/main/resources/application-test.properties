# ==========================================
# Configuration principale Spring Boot
# ==========================================
# Nom de l'application
spring.application.name=PCS Trading

# Niveau de log : permet de contrôler la verbosité de Spring
logging.level.org.springframework=INFO

# ==========================================
# Configuration de la source de données TEST
# ==========================================
# Configuration du driver JDBC MySQL moderne
# (remplace com.mysql.jdbc.Driver, obsolète depuis MySQL Connector 8)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Paramètres de connexion à la base MySQL de test
# (chargés depuis le fichier .env.test)
spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Initialise automatiquement la DataSource si nécessaire
spring.datasource.initialize=true

# ==========================================
# Configuration Hibernate / JPA
# ==========================================
# ddl-auto=update : met à jour automatiquement le schéma si nécessaire
spring.jpa.hibernate.ddl-auto=update

# show-sql=true : affiche les requêtes SQL dans la console (utile pour les tests)
spring.jpa.show-sql=true

# Définition explicite du dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Configuration des logs Hibernate (spécifique aux tests)
# ==========================================
# Active un niveau de log détaillé pour visualiser les requêtes SQL générées
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace