# ==========================================
# Configuration principale Spring Boot
# ==========================================
# Nom de l'application
spring.application.name=PCS Trading (TEST)

# Niveau de log : permet de contrôler la verbosité de Spring
logging.level.org.springframework=INFO

# ==========================================
# Configuration de la source de données TEST
# ==========================================
# Configuration du driver JDBC MySQL moderne (remplace com.mysql.jdbc.Driver, obsolète depuis MySQL Connector 8)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://localhost:3306/test
# Paramètres de connexion à la base MySQL de test (chargés depuis le fichier .env.test)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Initialise automatiquement la DataSource si nécessaire
spring.datasource.initialize=true

# ==========================================
# Configuration Hibernate / JPA
# ==========================================
# Force Spring à exécuter les scripts SQL même pour MySQL, Postgres, etc.
spring.sql.init.mode=always

# Chemins des scripts de création et d'alimentation
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql

# Hibernate ne touche pas au schéma
spring.jpa.hibernate.ddl-auto=none

# show-sql=true : affiche les requêtes SQL dans la console (utile pour les tests)
spring.jpa.show-sql=true
# Formater le SQL pour qu'il soit lisible
spring.jpa.properties.hibernate.format_sql=true
# Affiche les valeurs des paramètres SQL (binding) pour Hibernate 6 / Spring Boot 3
# Permet de voir dans les logs quelles valeurs remplacent les " ?" dans les requêtes préparées
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Définition explicite du dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Configuration des logs Hibernate (spécifique aux tests)
# ==========================================
# Active un niveau de log détaillé pour visualiser les requêtes SQL générées
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace